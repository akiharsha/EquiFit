<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:0.1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#138808;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#grad1)"/>
  
  <!-- Abstract shapes representing India and technology -->
  <circle cx="200" cy="150" r="80" fill="#FF6B35" opacity="0.1"/>
  <circle cx="1000" cy="650" r="120" fill="#138808" opacity="0.1"/>
  <circle cx="600" cy="400" r="60" fill="#0066cc" opacity="0.1"/>
  
  <!-- Tech elements -->
  <rect x="100" y="300" width="40" height="40" rx="8" fill="#FF6B35" opacity="0.2"/>
  <rect x="1050" y="200" width="30" height="30" rx="6" fill="#138808" opacity="0.2"/>
  <rect x="500" y="100" width="35" height="35" rx="7" fill="#0066cc" opacity="0.2"/>
  
  <!-- Connection lines -->
  <line x1="200" y1="150" x2="600" y2="400" stroke="#FF6B35" stroke-width="2" opacity="0.3"/>
  <line x1="600" y1="400" x2="1000" y2="650" stroke="#138808" stroke-width="2" opacity="0.3"/>
</svg>
