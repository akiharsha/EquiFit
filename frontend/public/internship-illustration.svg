<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#138808;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- People silhouettes -->
  <circle cx="120" cy="80" r="25" fill="#FF6B35"/>
  <rect x="105" y="105" width="30" height="50" rx="15" fill="#FF6B35"/>
  
  <circle cx="200" cy="85" r="22" fill="#138808"/>
  <rect x="188" y="107" width="24" height="45" rx="12" fill="#138808"/>
  
  <circle cx="280" cy="82" r="20" fill="#0066cc"/>
  <rect x="270" y="102" width="20" height="40" rx="10" fill="#0066cc"/>
  
  <!-- Building/Government structure -->
  <rect x="50" y="180" width="300" height="80" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  <rect x="70" y="200" width="20" height="40" fill="#FF6B35"/>
  <rect x="110" y="200" width="20" height="40" fill="#138808"/>
  <rect x="150" y="200" width="20" height="40" fill="#0066cc"/>
  <rect x="190" y="200" width="20" height="40" fill="#FF6B35"/>
  <rect x="230" y="200" width="20" height="40" fill="#138808"/>
  <rect x="270" y="200" width="20" height="40" fill="#0066cc"/>
  <rect x="310" y="200" width="20" height="40" fill="#FF6B35"/>
  
  <!-- Connection arrows -->
  <path d="M120 155 L120 180" stroke="#FF6B35" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M200 152 L200 180" stroke="#138808" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M280 142 L280 180" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Text elements -->
  <text x="200" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333">
    AI-Powered Matching
  </text>
</svg>
