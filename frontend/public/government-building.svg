<svg width="500" height="300" viewBox="0 0 500 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#138808;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Main building structure -->
  <rect x="50" y="120" width="400" height="150" fill="url(#buildingGrad)" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- Columns -->
  <rect x="80" y="120" width="25" height="150" fill="#ffffff" stroke="#dee2e6"/>
  <rect x="130" y="120" width="25" height="150" fill="#ffffff" stroke="#dee2e6"/>
  <rect x="180" y="120" width="25" height="150" fill="#ffffff" stroke="#dee2e6"/>
  <rect x="230" y="120" width="25" height="150" fill="#ffffff" stroke="#dee2e6"/>
  <rect x="280" y="120" width="25" height="150" fill="#ffffff" stroke="#dee2e6"/>
  <rect x="330" y="120" width="25" height="150" fill="#ffffff" stroke="#dee2e6"/>
  <rect x="380" y="120" width="25" height="150" fill="#ffffff" stroke="#dee2e6"/>
  
  <!-- Roof -->
  <polygon points="30,120 250,50 470,120" fill="#FF6B35"/>
  
  <!-- Flag pole -->
  <rect x="245" y="20" width="4" height="30" fill="#8B4513"/>
  
  <!-- Indian flag -->
  <rect x="249" y="20" width="30" height="20" fill="#FF6B35"/>
  <rect x="249" y="30" width="30" height="7" fill="#ffffff"/>
  <rect x="249" y="37" width="30" height="7" fill="#138808"/>
  <circle cx="264" cy="33" r="3" fill="#000080"/>
  
  <!-- Steps -->
  <rect x="40" y="260" width="420" height="10" fill="#dee2e6"/>
  <rect x="60" y="270" width="380" height="8" fill="#dee2e6"/>
  <rect x="80" y="278" width="340" height="6" fill="#dee2e6"/>
  
  <!-- Windows -->
  <rect x="100" y="140" width="15" height="20" fill="#87CEEB"/>
  <rect x="150" y="140" width="15" height="20" fill="#87CEEB"/>
  <rect x="200" y="140" width="15" height="20" fill="#87CEEB"/>
  <rect x="250" y="140" width="15" height="20" fill="#87CEEB"/>
  <rect x="300" y="140" width="15" height="20" fill="#87CEEB"/>
  <rect x="350" y="140" width="15" height="20" fill="#87CEEB"/>
  
  <!-- Door -->
  <rect x="230" y="200" width="40" height="70" fill="#8B4513"/>
  <circle cx="260" cy="235" r="2" fill="#FFD700"/>
  
  <!-- Text -->
  <text x="250" y="290" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#333">
    Government of India
  </text>
</svg>
